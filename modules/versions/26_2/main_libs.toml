[versions]
minecraft = "26.2"

fabric-loader = "0.19.5"

antlr = "4.13.1"
glsl-transformer = "3.0.0-pre3"
jcpp = "1.4.14"

fabric-api = "0.160.0+26.2"

# Iris 1.11.2 pairs with Sodium 0.9.1. Iris 1.11.4 declares `breaks: iris <=1.11.2` against
# Sodium 0.9.2, so the two pairings are 1.11.2/0.9.1 and 1.11.4/0.9.2 -- not interchangeable.
# 1.11.2/0.9.1 is the pairing Voxy supports.
sodium = "mc26.2-0.9.1-fabric"
iris = "1.11.2+26.2-fabric"

[libraries]
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }

antlr4-runtime = { module = "org.antlr:antlr4-runtime", version.ref = "antlr" }
glsl-transformer = { module = "io.github.douira:glsl-transformer", version.ref = "glsl-transformer" }
jcpp = { module = "org.anarres:jcpp", version.ref = "jcpp" }

sodium = { module = "maven.modrinth:sodium", version.ref = "sodium" }
iris = { module = "maven.modrinth:iris", version.ref = "iris" }
